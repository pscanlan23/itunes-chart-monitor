name: Diagnose
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 probe.py
      - name: Commit
        if: always()
        run: |
          git config user.name "itunes-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag.txt
          git diff --staged --quiet || { git commit -m "probe results"; git push; }
