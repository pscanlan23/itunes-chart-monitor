name: Manage alert recipients

# Gives you a form in the Actions tab for adding, changing or removing who gets
# chart alerts -- no JSON editing. Only people with write access to this repo
# can run it, so the recipient list is never open to the public.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do?"
        required: true
        default: add
        type: choice
        options: [add, update, remove, list]
      address:
        description: "Email address (ignored for 'list')"
        required: false
        type: string
      alerts:
        description: "How often should they be emailed?"
        required: true
        default: significant
        type: choice
        options:
          - every_change
          - significant
          - milestones
          - none
      min_move:
        description: "For 'significant' only: how many places counts as a real move"
        required: false
        default: "5"
        type: string

permissions:
  contents: write

concurrency:
  group: itunes-monitor

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply change
        run: |
          python3 manage_recipients.py \
            --action "${{ inputs.action }}" \
            --address "${{ inputs.address }}" \
            --alerts "${{ inputs.alerts }}" \
            --min-move "${{ inputs.min_move }}"

      - name: Commit
        if: inputs.action != 'list'
        run: |
          git config user.name  "itunes-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          if git diff --staged --quiet; then
            echo "No change to commit."
          else
            git commit -m "recipients: ${{ inputs.action }} ${{ inputs.address }}"
            git pull --rebase --autostash origin main
            git push
          fi
